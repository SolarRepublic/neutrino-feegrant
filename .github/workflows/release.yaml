name: Release

on:
  push:
    tags:
      - v*

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set Docker tag
        id: set-docker-tag
        run: |
          # If the Git ref name starts with "v", remove that "v" to make the CLEAN_TAG
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            CLEAN_TAG="${GITHUB_REF_NAME#v}"
            echo "IMAGE_TAG=${CLEAN_TAG}" >> $GITHUB_ENV
          else
            # If it's not a v-tag, use tag label as-is
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/solarrepublic/${{ github.event.repository.name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/solarrepublic/${{ github.event.repository.name }}:latest
            ghcr.io/solarrepublic/${{ github.event.repository.name }}:${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
